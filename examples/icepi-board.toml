# Board-1 reference harness, shared by all five boards. See docs/bringup.md.
version = 1
name = "icepi-board"

[capture]
sample_rate = 100_000_000
duration_s = 0.05
threshold_v = 3.3

[signals]
sclk = 0
mosi = 1
miso = 2
cs_n = 3
scl = 4
sda = 5
uart_tx = 6
uart_rx = 7
rst_n = 8
ena = 9
mode = 10
serial_data = 11
clk = 12
event = 13
error = 14
uo_out_0 = 15

[trigger]
signal = "event"
edge = "rising"
pre_trigger_s = 0.01
post_trigger_s = 0.05
timeout_s = 30.0

[[analyzers]]
name = "SPI"
label = "spi"
[analyzers.channels]
Clock = "sclk"
MOSI = "mosi"
MISO = "miso"
Enable = "cs_n"
[analyzers.settings]
"Bits per Transfer" = "8 Bits per Transfer (Standard)"
"Significant Bit" = "Most Significant Bit First (Standard)"
"Clock State" = "Clock is Low when inactive (CPOL = 0)"
"Clock Phase" = "Data is Valid on Clock Leading Edge (CPHA = 0)"
"Enable Line" = "Enable line is Active Low (Standard)"

[[analyzers]]
name = "I2C"
label = "i2c"
[analyzers.channels]
SCL = "scl"
SDA = "sda"

[[analyzers]]
name = "Async Serial"
label = "uart_tx"
[analyzers.channels]
"Input Channel" = "uart_tx"
[analyzers.settings]
"Bit Rate (Bits/s)" = 115200
"Bits per Frame" = "8 Bits per Transfer (Standard)"
"Stop Bits" = "1 Stop Bit (Standard)"
"Parity Bit" = "No Parity Bit (Standard)"
"Significant Bit" = "Least Significant Bit Sent First (Standard)"
"Signal inversion" = "Non Inverted (Standard)"
"Mode" = "Normal"

[[analyzers]]
name = "Async Serial"
label = "uart_rx"
[analyzers.channels]
"Input Channel" = "uart_rx"
[analyzers.settings]
"Bit Rate (Bits/s)" = 115200
"Bits per Frame" = "8 Bits per Transfer (Standard)"
"Stop Bits" = "1 Stop Bit (Standard)"
"Parity Bit" = "No Parity Bit (Standard)"
"Significant Bit" = "Least Significant Bit Sent First (Standard)"
"Signal inversion" = "Non Inverted (Standard)"
"Mode" = "Normal"
