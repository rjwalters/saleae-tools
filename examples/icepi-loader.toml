# Fixed board harness: docs/bringup.md (physical pins differ from Saleae channels).
# Proposed Saleae probe map for the emulator's reset-gated program loader.
# This custom synchronous serial interface is NOT SPI.
version = 1
name = "icepi-program-loader"

[capture]
sample_rate = 100_000_000
duration_s = 0.05
threshold_v = 3.3

[signals]
clk = 12
rst_n = 8
mode = 10        # ui_in[7]
serial_data = 11 # ui_in[0]
ena = 9
event = 13     # header 22 / BCM25; FPGA event marker
